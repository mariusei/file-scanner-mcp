# Run `uv run pre-commit install` once to enable. Mirrors the quality job in
# .github/workflows/test.yml, so a clean commit is a clean CI run.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Byte-exact inputs: golden snapshots, the malformed parser fixtures,
        # and the raw experiment logs.
        exclude: &frozen ^(tests/(golden|[a-z]+/samples)|experiments)/
      - id: trailing-whitespace
        exclude: *frozen
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Runs on push, not commit: a tag that disagrees with the version in the
  # commit it points at is only expensive once it reaches GitHub.
  - repo: local
    hooks:
      - id: tag-matches-version
        name: tag matches packaged version
        entry: uv run scripts/check_tag_version.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
