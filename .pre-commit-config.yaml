# Run `uv run pre-commit install` once to enable. Mirrors the quality job in
# .github/workflows/test.yml, so a clean commit is a clean CI run.
repos:
  # Ruff runs from the dev group rather than a rev pinned here. Two pinned
  # versions drift, and when the hook and CI disagree on formatting you get
  # a loop: the hook reformats, CI rejects, repeat. pyproject owns it, so
  # dependabot's dev group keeps it current.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Byte-exact inputs: golden snapshots, the malformed parser fixtures,
        # and the raw experiment logs.
        exclude: &frozen ^(tests/(golden|[a-z]+/samples)|experiments)/
      - id: trailing-whitespace
        exclude: *frozen
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Runs on push, not commit: a tag that disagrees with the version in the
  # commit it points at is only expensive once it reaches GitHub.
  - repo: local
    hooks:
      - id: tag-matches-version
        name: tag matches packaged version
        entry: uv run scripts/check_tag_version.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
