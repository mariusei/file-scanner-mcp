# Build configuration for the demo app.
# Regenerated by tools/release.py; edit the template instead.

# Package identity
name = "demo-app"
version = "1.2.3"  # trailing comment: left alone

[server]
# Listening address; 0.0.0.0 in containers
host = "localhost"
port = 8080
# ---
# Ports below 1024 need CAP_NET_BIND_SERVICE on Linux,
# which the container runtime does not grant by default.

# TLS is off in development
[server.tls]
enabled = false
deps = [
  # comments inside arrays are ignored
  "a",
]
