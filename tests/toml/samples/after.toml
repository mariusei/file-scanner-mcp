# Project configuration
name = "demo-app"
version = "1.2.3"

[server]
host = "localhost"
port = 8443

[server.tls]
enabled = true

[[plugins]]
name = "auth"
enabled = true

[[plugins]]
name = "cache"
enabled = false

# Limits applied to every worker.
# Raise them together; the queue depth follows the pool size.
[quotas]
pool_size = 8
queue_depth = 64

[logging]
level = "info"
